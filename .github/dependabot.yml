version: 2

updates:
  # `bun`, not `npm`: the npm ecosystem bumps `package.json` but never touches
  # `bun.lock`, so every PR it opens fails `bun install --frozen-lockfile` in
  # CI. Requires Bun >= 1.1.39 (`mise.toml` pins it) and the text `bun.lock` —
  # the binary `bun.lockb` is not supported.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The Sanity packages share peer ranges — @sanity/ui in particular must
      # resolve to a single copy or Studio theming breaks. Bumping them together
      # keeps the tree consistent.
      sanity:
        patterns:
          - 'sanity'
          - '@sanity/*'
          - 'sanity-plugin-*'
          - 'next-sanity'
          - '@portabletext/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      # No `dependency-type: development` here. That key is supported only for
      # bundler, composer, mix, maven, npm and pip — not bun — and every pattern
      # below is already a devDependency, so it narrowed nothing.
      dev-tooling:
        patterns:
          - '@biomejs/biome'
          - 'typescript'
          - '@types/*'
    ignore:
      # TypeScript 7 ships no programmatic API, so the `next` language-service
      # plugin in tsconfig.json stops loading. Revisit at 7.1.
      # See docs/upgrading.md.
      - dependency-name: typescript
        versions: ['7.x']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
